services:
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: purificadora
      MYSQL_USER: purificadora
      MYSQL_PASSWORD: purificadora
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/mysql
      - ./backend-purificadora/db/db.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3307:3306"

  api:
    build: ./backend-purificadora
    environment:
      PORT: 5001
      DB_HOST: db
      DB_NAME: purificadora
      DB_USER: purificadora
      DB_PASS: purificadora
      JWT_SECRET: purificadora_dev_secret
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5001:5001"

  frontend:
    build: ./Frontend-purificadora
    depends_on:
      - api
    expose:
      - "80"

  nginx:
    image: nginx:alpine
    depends_on:
      - frontend
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  db_data:
