<mat-card class="crud-card">
  <mat-card-title class="card-title">Gestión de Inventario</mat-card-title>

  <!-- Tabla de Inventario -->
  <div class="table-container">
    <table mat-table [dataSource]="inventario" class="mat-elevation-z8 inventario-table">
      <!-- Columna: Nombre del Producto -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Producto </th>
        <td mat-cell *matCellDef="let item"> {{ item.Producto.nombre }} </td>
      </ng-container>

      <!-- Columna: Cantidad -->
      <ng-container matColumnDef="cantidad">
        <th mat-header-cell *matHeaderCellDef> Cantidad </th>
        <td mat-cell *matCellDef="let item">
          <input matInput type="number" [(ngModel)]="item.cantidad" min="0" class="cantidad-input" />
        </td>
      </ng-container>

      <!-- Columna: Estado -->
      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let item">
          <mat-select [(ngModel)]="item.estado" class="estado-select">
            <mat-option value="Disponible">Disponible</mat-option>
            <mat-option value="Poca Existencia">Poca Existencia</mat-option>
          </mat-select>
        </td>
      </ng-container>

      <!-- Columna: Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let item">
          <button mat-raised-button color="primary" (click)="guardarCambios(item)">
            Guardar
          </button>
        </td>
      </ng-container>

      <!-- Cabecera y Filas -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</mat-card>
