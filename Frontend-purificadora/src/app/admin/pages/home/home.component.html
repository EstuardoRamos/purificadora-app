<mat-sidenav-container fullscreen>
  <mat-sidenav #sidenav mode="push">
      <mat-toolbar class="sidenav-header">
          <span class="menu-title">Menú</span>
          <button mat-icon-button (click)="sidenav.toggle()">
              <mat-icon>close</mat-icon>
          </button>
      </mat-toolbar>

      <div class="menu-sections">
        <ng-container *ngFor="let section of menuSections; let i = index">
          <ng-container *ngIf="tieneItems(section)">
            
            <!-- Header de sección desplegable -->
            <div class="section-header" (click)="toggleSection(i)">
              <mat-icon class="section-icon">{{ section.icon }}</mat-icon>
              <span class="section-title">{{ section.title }}</span>
              <mat-icon class="expand-icon">
                {{ section.expanded ? 'expand_less' : 'expand_more' }}
              </mat-icon>
            </div>

            <!-- Items de la sección -->
            <div class="section-items" *ngIf="section.expanded">
              <ng-container *ngFor="let item of section.items">
                <a
                  class="menu-item"
                  (click)="sidenav.toggle()"
                  [routerLink]="item.route"
                  routerLinkActive="active-item"
                  *ngIf="puedeVer(item.roles)"
                >
                  <mat-icon class="item-icon">{{ item.icon }}</mat-icon>
                  <span class="item-label">{{ item.label }}</span>
                </a>
              </ng-container>
            </div>

          </ng-container>
        </ng-container>
      </div>
  </mat-sidenav>

  <mat-toolbar class="main-toolbar">
      <button mat-icon-button (click)="sidenav.toggle()">
          <mat-icon>menu</mat-icon>
      </button>
      
      <span class="spacer"></span>
      
      <div class="user-section">
          <mat-icon>account_circle</mat-icon>
          <span class="user-name">{{ usuarioActual?.nombre || 'Usuario' }}</span>
      </div>
      
      <button mat-icon-button (click)="cerrarSesion()" matTooltip="Cerrar sesión">
          <mat-icon>logout</mat-icon>
      </button>
  </mat-toolbar>

  <div class="container">
      <router-outlet></router-outlet>
  </div>
</mat-sidenav-container>
