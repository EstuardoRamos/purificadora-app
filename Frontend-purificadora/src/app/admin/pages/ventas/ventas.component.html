<mat-card>
  <mat-card-title class="card-title">Ventas del Día</mat-card-title>

  <!-- Tabla de Clientes -->
  <table mat-table [dataSource]="clientes" class="mat-elevation-z8 clientes-table">
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef> Cliente </th>
      <td mat-cell *matCellDef="let cliente"> {{ cliente.nombre }} </td>
    </ng-container>

    <ng-container matColumnDef="ruta">
      <th mat-header-cell *matHeaderCellDef> Ruta </th>
      <td mat-cell *matCellDef="let cliente"> {{ cliente.ruta }} </td>
    </ng-container>

    <ng-container matColumnDef="coordenadas">
      <th mat-header-cell *matHeaderCellDef> Ubicación </th>
      <td mat-cell *matCellDef="let cliente">
        <a
          class="link-mapa"
          [href]="'https://www.google.com/maps?q=' + cliente.coordenadas"
          target="_blank"
        >
          Ver en mapa
        </a>
      </td>
    </ng-container>

    <ng-container matColumnDef="estado">
      <th mat-header-cell *matHeaderCellDef> Estado </th>
      <td mat-cell *matCellDef="let cliente">
        <span
          [ngClass]="{
            'abastecido': cliente.estado === 'abastecido',
            'desabastecido': cliente.estado === 'desabastecido'
          }"
        >
          {{ cliente.estado }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef> Acciones </th>
      <td mat-cell *matCellDef="let cliente">
        <button mat-raised-button color="accent" (click)="registrarVenta(cliente)">
          Registrar Venta
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <!-- Formulario de Venta -->
  <mat-card *ngIf="mostrarFormularioVenta" class="venta-form-card">
    <mat-card-title class="card-title">Registrar Venta</mat-card-title>
    <form>
      <!-- Cliente Seleccionado -->
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Cliente</mat-label>
        <input matInput placeholder="Selecciona un cliente" [value]="clienteSeleccionado?.nombre" disabled />
      </mat-form-field>

      <!-- Productos -->
      <div *ngFor="let producto of productos; let i = index" class="producto-item">
        <!-- Nombre y precio del producto -->
        <span class="producto-detalle">
          {{ producto.nombre }} - <strong>${{ producto.precio }}</strong>
        </span>

        <!-- Input de cantidad -->
        <mat-form-field appearance="fill" class="cantidad-field">
          <mat-label>Cantidad</mat-label>
          <input
            matInput
            type="number"
            min="0"
            name="producto_{{ i }}"
            [(ngModel)]="producto.cantidad"
            (ngModelChange)="calcularTotal()"
          />
        </mat-form-field>
      </div>


      <!-- Total y Método de Pago -->
      <div class="totales">
        <mat-form-field appearance="fill" class="total-field">
          <mat-label>Total</mat-label>
          <input matInput type="number" [value]="totalVenta" disabled />
        </mat-form-field>

        <mat-form-field appearance="fill" class="metodo-field">
          <mat-label>Método de Pago</mat-label>
          <mat-select [(ngModel)]="venta.metodoPago">
            <mat-option value="pago">Pago</mat-option>
            <mat-option value="credito">Crédito</mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <!-- Botones -->
      <div class="form-buttons">
        <button mat-raised-button color="primary" (click)="guardarVenta()">Guardar</button>
        <button mat-raised-button color="warn" (click)="cancelarVenta()">Cancelar</button>
      </div>
    </form>
  </mat-card>
</mat-card>
