<mat-card class="crud-card">
  <mat-card-title class="card-title">Gestión de Inventario</mat-card-title>

  <!-- Tabla de Inventario -->
  <div class="table-container">
    <table mat-table [dataSource]="inventario" class="mat-elevation-z8 inventario-table">
      <!-- Columna: Nombre del Producto -->
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Producto </th>
        <td mat-cell *matCellDef="let item"> {{ item.Producto.nombre }} </td>
      </ng-container>

      <!-- Columna: Cantidad -->
      <ng-container matColumnDef="cantidad">
        <th mat-header-cell *matHeaderCellDef> Cantidad </th>
        <td mat-cell *matCellDef="let item"> {{ item.cantidad }} </td>
      </ng-container>

      <!-- Columna: Acciones -->
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let item">
          <button mat-raised-button color="primary" (click)="abrirFormulario(item)">
            Actualizar
          </button>
        </td>
      </ng-container>

      <!-- Cabecera y Filas -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <!-- Formulario de Incremento/Decremento -->
  <mat-card *ngIf="mostrarFormulario" class="form-card">
    <mat-card-title class="card-title">
      Actualizar Inventario: {{ productoSeleccionado?.Producto?.nombre }}
    </mat-card-title>
    <form>
      <!-- Acción -->
      <mat-form-field appearance="fill">
        <mat-label>Acción</mat-label>
        <mat-select [(ngModel)]="accion" name="accion" required>
          <mat-option value="incrementar">Aumentar</mat-option>
          <mat-option value="disminuir">Disminuir</mat-option>
        </mat-select>
      </mat-form-field>

      <!-- Cantidad -->
      <mat-form-field appearance="fill">
        <mat-label>Cantidad</mat-label>
        <input matInput type="number" [(ngModel)]="cantidadCambio" name="cantidadCambio" min="1" required />
      </mat-form-field>

      <!-- Botones -->
      <div class="form-buttons">
        <button mat-raised-button color="primary" (click)="guardarCambio()">Guardar</button>
        <button mat-raised-button color="warn" (click)="cancelarFormulario()">Cancelar</button>
      </div>
    </form>
  </mat-card>
</mat-card>
